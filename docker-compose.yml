version: '3.8'

services:
  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: swiftmint-backend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=mongodb://mongo:27017/swiftmint
    depends_on:
      - mongo
    restart: unless-stopped
    networks:
      - swiftmint-network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: swiftmint-frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - swiftmint-network

  # MongoDB Database (for future use)
  mongo:
    image: mongo:7
    container_name: swiftmint-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=password
      - MONGO_INITDB_DATABASE=swiftmint
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped
    networks:
      - swiftmint-network

  # Redis Cache (for future use)
  redis:
    image: redis:7-alpine
    container_name: swiftmint-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - swiftmint-network

networks:
  swiftmint-network:
    driver: bridge

volumes:
  mongo-data:
  redis-data:
